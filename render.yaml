services:
  - type: web
    name: appliance-repair-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # ข้ามการดาวน์โหลดไฟล์ CUDA ของ onnxruntime-node บน Linux (ใหญ่มาก เราใช้ CPU)
      - key: ONNXRUNTIME_NODE_INSTALL
        value: skip
      - key: CORS_ORIGIN
        value: https://parit-ru.github.io
      - key: SYMPTOM_SEARCH_ENABLED
        value: "true"
      - key: REPHRASE_ENABLED
        value: "true"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL_CA
        sync: false
